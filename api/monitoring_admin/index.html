<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* Solviva brand palette, taken from solvivaenergy.com's CSS variables
     (assets/brand/README.md): primary-dark #1f512a, primary-mid #50890a,
     primary-light (lime) #d2ff1e, secondary blues #006ac6/#00a7ea, neutrals
     #212121/#fcfcfc/#e4e7ec, greys #667085/#475467/#101828. */
  :root{--bg:#f5f6f4;--card:#fff;--line:#e4e7ec;--text:#212121;--muted:#667085;--brand:#1f512a;--brand-2:#50890a;--accent:#d2ff1e;--accent-soft:#f1ffb3;--info:#006ac6;--warn:#b7791f;--bad:#b42318;--ok:#3f7a0b;--chip:#eef1f4;--radius:10px}
  *{box-sizing:border-box}
  /* Our `header{display:flex}` outranks the browser's default `[hidden]{display:none}`,
     which showed the tab bar on the login screen. Make hidden mean hidden. */
  [hidden]{display:none!important}
  body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  header .spacer{flex:1}
  nav.tabs{display:flex;gap:4px}
  nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
  nav.tabs button.active{background:var(--chip);color:var(--text)}
  .who{color:var(--muted);font-size:13px}
  .who b{color:var(--text)}
  /* Brand bar: Solviva dark green with the lime accent, as on solvivaenergy.com. */
  #topbar{background:var(--brand);border-bottom:3px solid var(--accent);color:#fff}
  #topbar h1{color:#fff;display:flex;align-items:center;gap:10px}
  #topbar h1 .logo{height:28px;width:28px;border-radius:6px;display:block}
  #topbar nav.tabs button{color:rgba(255,255,255,.78)}
  #topbar nav.tabs button:hover{background:rgba(255,255,255,.1);color:#fff}
  #topbar nav.tabs button.active{background:var(--accent);color:var(--brand)}
  #topbar .who{color:rgba(255,255,255,.78)}
  #topbar .who b{color:#fff}
  #topbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
  #topbar .btn:hover{background:rgba(255,255,255,.12)}
  main{padding:16px 20px;max-width:1600px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;overflow-x:auto}
  /* Cells default to nowrap so tables stay scannable; opt specific columns into wrapping. */
  td.wrap{white-space:normal;min-width:220px;max-width:440px}
  .tag.sig{white-space:nowrap;margin:1px 3px 1px 0;cursor:help}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  input[type=search]{min-width:280px}
  button{font:inherit}
  .btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-2)}
  .btn.danger{color:var(--bad);border-color:#f1c5c0}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:4px 9px;font-size:12px}
  .chip{padding:5px 10px;border-radius:999px;background:var(--chip);border:1px solid transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip.active{border-color:var(--brand);color:var(--brand);background:var(--accent-soft)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
  th{position:sticky;top:0;background:#fafbfc;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;user-select:none}
  tbody tr:hover{background:#f5f9ea}
  #grid tbody tr,tr[data-row-open]{cursor:pointer}
  /* Action column pinned to the right edge of a horizontally scrolling table,
     so "Open" is reachable without scrolling. Rows also open on click. */
  /* Dim the page while a record is open; clicking the dimmed area closes it. */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,32,.38);z-index:9;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s}
  .backdrop.show{opacity:1;visibility:visible;pointer-events:auto}
  .tablewrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:var(--radius);background:#fff}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--chip);color:var(--muted)}
  .tag.ok{background:#eaf4dc;color:var(--ok)}.tag.warn{background:#fdf3e1;color:var(--warn)}.tag.bad{background:#fdecea;color:var(--bad)}
  .panel{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .18s ease;z-index:10;display:flex;flex-direction:column}
  .panel.open{transform:none}
  .panel header{position:static;border-bottom:1px solid var(--line)}
  .panel .body{overflow:auto;padding:14px 18px 40px;flex:1}
  .panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:18px 0 8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .grid2 label,.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid2 input,.grid2 select,.field input,.field textarea{width:100%}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .verdict{font-size:12.5px;padding:8px 10px;border-radius:8px;background:#fafbfc;border:1px solid var(--line);margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .audit li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .audit .when{color:var(--muted)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.bad{background:var(--bad)}
  .login{max-width:400px;margin:70px auto;border-top:4px solid var(--accent)}
  .login .brand{display:block;height:46px;margin:2px 0 18px}
  .login h2{margin:0 0 6px}
  .login .field{margin-bottom:10px}
  .login .or{color:var(--muted);text-align:center;margin:12px 0;font-size:12px}
  .kpi{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .kpi .card{padding:10px 14px;min-width:150px}
  .kpi .n{font-size:22px;font-weight:700;color:var(--brand)}
  .kpi .l{font-size:12px;color:var(--muted)}
  ul.plain{list-style:none;margin:0;padding:0}
  .sect{margin-bottom:18px}
  .hint{font-size:12px;color:var(--muted)}
  @media (max-width:800px){.grid2{grid-template-columns:1fr}input[type=search]{min-width:0;flex:1}}
</style>
</head>

const daysSince = (v) => v ? Math.floor((Date.now() - new Date(v).getTime())/86400000) : null;

let sb = null, session = null, me = null;
let ROWS = [], FILTER = 'all', SORT = {key:'full_name', dir:1}, VALIDATIONS = {};

function toast(msg, bad=false){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast', 3500); }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (session?.access_token) headers.Authorization = 'Bearer ' + session.access_token;
  const r = await fetch(path, Object.assign({}, opts, {headers, body: opts.body && typeof opts.body!=='string' ? JSON.stringify(opts.body) : opts.body}));
  if (r.status === 401) { await signOut(); throw new Error('Session expired — please sign in again'); }
  let data = null; try { data = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error((data && (data.detail?.message || data.detail || data.error)) || `HTTP ${r.status}`);
  return data;
}

async function boot(){
  const cfg = await (await fetch('/monitoring-admin/api/config')).json();
  sb = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(async (event, s) => {
    session = s;
    if (event === 'PASSWORD_RECOVERY') { show('recovery'); return; }
    if (session) await afterLogin(); else show('login');
  });
  const {data} = await sb.auth.getSession();
  session = data.session;
  if (session) await afterLogin(); else show('login');
}

function show(view){
  $$('main > section').forEach(s => s.hidden = true);
  const el = $('#view-'+view); if (el) el.hidden = false;
  $('#topbar').hidden = !(me && view!=='login' && view!=='recovery');
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===view));
}

async function afterLogin(){
  try {
    me = await api('/monitoring-admin/api/me');
  } catch (e) {
    me = null;
    $('#login-msg').textContent = /403|authorised/i.test(e.message) ? `${session?.user?.email} is signed in but is not a staff account. Ask an admin to add you.` : e.message;
    show('login'); return;
  }
  $('#who').innerHTML = `<b>${esc(me.email)}</b> · ${esc(me.role)}`;
  $('#tab-staff').hidden = me.role !== 'admin';
  show('customers');
  await loadRows();
}

async function signOut(){ try { await sb.auth.signOut(); } catch(e){} session=null; me=null; show('login'); }

  {key:'odoo_lead_id', label:'Odoo lead', render:r => r.odoo_lead_id ? `<span class="mono">${r.odoo_lead_id}</span>` : '<span class="muted">—</span>'},

  {key:'solis_plant_name', label:'Plant (Solis)', render:r => esc(r.solis_plant_name||r.system_name||'—')},
  {key:'capacity_kwp', label:'kWp', render:r => r.capacity_kwp ?? '—'},
  {key:'last_daily', label:'Last daily', render:r => { const d = daysSince(r.last_daily); return d===null ? '<span class="tag bad">never</span>' : `${fmtDate(r.last_daily)}${d>3?` <span class="tag ${d>30?'bad':'warn'}">${d}d</span>`:''}`; }},
  {key:'last_5m', label:'Last 5-min', render:r => r.last_5m ? fmtTs(r.last_5m).slice(11,16) : '—'},

];
function vTag(r){ const v = VALIDATIONS[r.system_id]; if(!v) return ''; const s=v.solis_station?.status||v.status; return s ? ` <span class="tag ${/ok|found|assigned/i.test(s)?'ok':/unavail/i.test(s)?'warn':'bad'}" title="${esc(JSON.stringify(v))}">${esc(s)}</span>` : ''; }

const NAME_STOP = new Set(['residence','residential','house','home','plant','system','solar','meter','grocery','store','inc','corp','mr','mrs','ms','dr','engr','and','the','of','de','dela','del','san','sta','sto','jr','sr','2nd','3rd']);
const nameTokens = s => new Set(String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(t => t.length > 2 && !NAME_STOP.has(t)));
const shareWord = (a, b) => { const A = nameTokens(a), B = nameTokens(b); if (!A.size || !B.size) return true; for (const t of A) if (B.has(t)) return true; return false; };
// "Odoo ≠ Supabase" (and Solis): any of the three systems disagreeing about who this customer is.
function mismatch(r){
  const le = (r.login_email||'').toLowerCase(), oe = (r.odoo_email||r.odoo_lead_email||'').toLowerCase(), se = (r.solis_user_email||'').toLowerCase();
  if (oe && le && oe !== le) return true;
  if (se && le && se !== le) return true;
  if (!shareWord(r.full_name, r.odoo_customer_name||r.odoo_lead_name)) return true;   // Odoo calls the customer something else
  if (!shareWord(r.full_name, r.solis_plant_name)) return true;                       // the plant is named after someone else
  return false;
}
function applyFilter(rows){
  const q = $('#q').value.trim().toLowerCase();
  return rows.filter(r => {
    if (FILTER==='nostation' && r.solis_station_id) return false;
    if (FILTER==='dark' && !(daysSince(r.last_daily)===null || daysSince(r.last_daily)>3)) return false;
    if (FILTER==='mismatch' && !mismatch(r)) return false;
    if (FILTER==='multi' && !(r._multi>1)) return false;
    if (FILTER==='backfill' && !r.active_job_status) return false;
    if (!q) return true;
    return [r.full_name, r.login_email, r.odoo_email, r.odoo_lead_email, r.odoo_customer_name, r.odoo_lead_name, r.solis_station_id, r.solis_plant_name, r.system_name, r.odoo_lead_id, r.odoo_partner_id, r.phone].some(v => String(v??'').toLowerCase().includes(q));
  });
}
function renderGrid(){
  const rows = applyFilter(ROWS).sort((a,b) => { const x=a[SORT.key], y=b[SORT.key]; return (x==null)-(y==null) || (x>y?1:x<y?-1:0)*SORT.dir; });
  $('#grid thead').innerHTML = '<tr>' + COLS.map(c => `<th data-k="${c.key}">${c.label}${SORT.key===c.key?(SORT.dir>0?' ▲':' ▼'):''}</th>`).join('') + '</tr>';
  $('#grid tbody').innerHTML = rows.map(r => `<tr data-id="${r.system_id}">${COLS.map(c => `<td>${c.render(r)}</td>`).join('')}</tr>`).join('');
  $('#rowcount').textContent = `${rows.length} of ${ROWS.length}`;
}
async function loadRows(fresh=false){
  try {
    const data = await api('/monitoring-admin/api/rows' + (fresh ? '?fresh=1' : ''));
    const perUser = {}; data.rows.forEach(r => perUser[r.user_id] = (perUser[r.user_id]||0)+1);
    ROWS = data.rows.map(r => Object.assign(r, {_multi: perUser[r.user_id]}));
    renderGrid();
  } catch (e) { toast(e.message, true); }
}
$('#q').oninput = renderGrid;
$$('.chip').forEach(c => c.onclick = () => { FILTER = c.dataset.f; $$('.chip').forEach(x => x.classList.toggle('active', x===c)); renderGrid(); });
$('#grid thead').onclick = e => { const k = e.target.closest('th')?.dataset.k; if(!k) return; SORT = {key:k, dir: SORT.key===k ? -SORT.dir : 1}; renderGrid(); };
$('#grid tbody').onclick = e => { const id = e.target.closest('tr')?.dataset.id; if (id) openPanel(id); };
$('#btn-reload').onclick = () => loadRows(true);
$('#btn-validate-all').onclick = async () => {
  const rows = applyFilter(ROWS).slice(0, 500);
  toast(`Validating ${rows.length} rows…`);
  try {
    const res = await api('/admin/validate/rows', {method:'POST', body:{rows: rows.map(r => ({row_id:r.system_id, user_id:r.user_id, station_id:r.solis_station_id, odoo_lead_id:r.odoo_lead_id, odoo_partner_id:r.odoo_partner_id})), deep_check_missing:false}});
    (res.rows||res.results||res).forEach?.(v => { VALIDATIONS[v.row_id] = v; });
    renderGrid(); toast('Validation done — hover the tags for detail');
  } catch (e) { toast(e.message, true); }
};

// The "possible wrong station" scan is a name heuristic; it cannot clear a
// plant named after a business, a church or a relative. An engineer who has
// checked one ticks "manually verified". Who and when are stamped on the
// server from the session; the reason goes to the audit log. `after` is what
// to refresh: the panel (default) or the Unresolved tab.
async function setMappingVerified(r, verified, after){
  const refresh = after || (() => openPanel(r.system_id));
  const panelReason = $('#panel').classList.contains('open') ? ($('#reason')?.value||'').trim() : '';
  const reason = (panelReason || prompt(verified
    ? `Why does "${r.solis_plant_name||r.solis_station_id}" belong to ${r.full_name||r.system_name}? (recorded in the audit log)`
    : `Why is this mapping no longer verified? (recorded in the audit log)`) || '').trim();
  if (reason.length < 3) { toast('A reason is required — nothing changed', true); return refresh(); }
  try {
    await api('/monitoring-admin/api/systems/'+r.system_id+'/mapping-verified', {method:'POST', body:{verified, reason}});
    toast(verified ? 'Marked as manually verified — removed from Possible wrong station' : 'Verification removed — back in the scan');
    await loadRows(true);
  } catch (e) { toast(e.message, true); }
  refresh();
}

function formDiff(form, original, numeric=[]){
  const out = {};
  new FormData(form).forEach((v, k) => {
    let val = v === '' ? null : v;
    if (numeric.includes(k) && val !== null) val = Number(val);
    if (k === 'is_primary') val = v === 'true';
    const orig = original[k] ?? null;
    const same = (val === orig) || (val !== null && orig !== null && String(val) === String(orig)) || (k==='installation_date' && val && String(orig).slice(0,10)===val);
    if (!same) out[k] = val;
  });
  return out;
}
async function saveAll(r){
  const reason = $('#reason').value.trim();
  const sysFields = formDiff($('#f-system'), r, ['capacity_kwp','odoo_lead_id']);
  const profFields = formDiff($('#f-profile'), Object.assign({}, r, {address:r.profile_address}), ['odoo_partner_id']);
  const bf = $('#bf-after').checked ? {granularity: $('#bf-gran').value, days: Number($('#bf-days').value)} : null;
  if (!Object.keys(sysFields).length && !Object.keys(profFields).length && !bf) return toast('Nothing changed');
  try {
    if (Object.keys(profFields).length) await api('/monitoring-admin/api/profiles/'+r.user_id, {method:'PATCH', body:{fields:profFields, reason}});
    if (Object.keys(sysFields).length || bf) await api('/monitoring-admin/api/systems/'+r.system_id, {method:'PATCH', body:{fields:sysFields, reason, backfill:bf}});
    toast('Saved'); await loadRows(); openPanel(r.system_id);
  } catch (e) { toast(e.message, true); }
}

async function remap(r, dryRun){
  const detach = $('#remap-detach').checked;

  if (!detach && !/^\d{15,20}$/.test(sid)) return toast('Enter the correct station id (15–20 digits), or tick "No correct station is known"', true);
  const reason = ($('#reason')?.value||'').trim();
  if (!dryRun && reason.length < 3) return toast('Type the reason in the Save-changes box first — it goes into the audit log', true);
  const what = detach
    ? `Detach "${r.full_name||r.system_name}" from station ${r.solis_station_id}?\n\nAll readings recorded under it move to quarantine; the system becomes "pending" with no station until the right plant is attached. Continue?`
    : `Remap "${r.full_name||r.system_name}" from ${r.solis_station_id} to ${sid}?\n\nAll readings recorded under the old id move to quarantine and the correct history is backfilled. Continue?`;
  if (!dryRun && !confirm(what)) return;
  box.hidden = false; box.textContent = dryRun ? 'Previewing…' : (detach ? 'Detaching…' : 'Remapping…');
  try {
    const v = await api('/monitoring-admin/api/systems/'+r.system_id+'/remap', {method:'POST', body:{new_station_id: sid, reason, dry_run: dryRun, backfill_from: from}});
    const range = v.quarantine_range && v.quarantine_range[0] ? `${fmtDate(v.quarantine_range[0])} → ${fmtDate(v.quarantine_range[1])}` : '—';
    box.innerHTML = `<b>${dryRun ? 'Preview — nothing written yet' : 'Done'}</b><br>`
      + (v.detach
          ? `Station <span class="mono">${esc(v.old_station_id)}</span> → <b>none</b>; system becomes <span class="tag warn">pending</span> and the syncs skip it until a plant is attached.<br>`
          : `Station: <span class="mono">${esc(v.old_station_id)}</span> → <span class="mono">${esc(v.new_station_id)}</span><br>New identity from Solis: <b>${esc(v.new_plant_name||'?')}</b>, ${v.new_capacity_kwp??'?'} kWp, email ${esc(v.new_solis_email||'—')}, first power ${fmtDate(v.first_power_date)}<br>`)

function summarizeVerdict(v){
  if (!v || typeof v !== 'object') return esc(JSON.stringify(v));
  const status = v.status || v.verdict || v.solis_station?.status;
  const head = status ? `<span class="tag ${/ok|found|match|assigned|exists/i.test(status)?'ok':/unavail|stale/i.test(status)?'warn':'bad'}">${esc(status)}</span> ` : '';
  const interesting = Object.entries(v).filter(([k,x]) => x!=null && typeof x!=='object' && !['status','verdict'].includes(k)).map(([k,x]) => `<b>${esc(k)}</b>: ${esc(x)}`).join(' · ');
  const nested = Object.entries(v).filter(([k,x]) => x && typeof x==='object').map(([k,x]) => `\n${esc(k)}: ${esc(JSON.stringify(x))}`).join('');
  return head + interesting + `<span class="muted">${nested}</span>`;
}

// Signals arrive as full sentences from the API; show a short label, keep the
// sentence as the tooltip. Green = points to a wrong PROFILE NAME (mapping ok);
// amber = points to a wrong STATION.
const SIGNAL_LABELS = [
  [/shares no word/i,          'plant ≠ customer name', 'warn'],
  [/Odoo name also differs/i,  'Odoo name ≠ customer',  'warn'],
  [/plant email differs/i,     'Solis email ≠ login',   'warn'],
  [/MATCHES the login/i,       'Solis email = login ✓', 'ok'],
  [/matches the ODOO name/i,   'plant = Odoo name ✓',   'ok'],
  [/login email contains/i,    'same household ✓',      'ok'],
  [/organisation/i,            'organisation plant ✓',  'ok'],
];
function sigTag(x){
  const hit = SIGNAL_LABELS.find(([re]) => re.test(x));
  return `<span class="tag sig ${hit ? hit[2] : ''}" title="${esc(x)}">${esc(hit ? hit[1] : x)}</span>`;
}

        ${u.profiles_without_system.map(p => `<tr><td>${esc(p.full_name)}</td><td class="mono">${esc(p.email)}</td><td class="mono">${esc(p.solis_station_id||'—')}</td><td>${fmtDate(p.created_at)}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">none</td></tr>'}
        </tbody></table></div>

      <div class="card sect"><h3 style="margin-top:0">Stations without a Solis id</h3>
        <table><thead><tr><th>Customer</th><th>System</th><th>kWp</th><th>Last daily</th></tr></thead><tbody>
        ${u.systems_without_station.map(s => `<tr data-row-open="${s.system_id}"><td>${esc(s.full_name)}</td><td>${esc(s.system_name)}</td><td>${s.capacity_kwp??''}</td><td>${fmtDate(s.last_daily)}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">none</td></tr>'}
        </tbody></table></div>

      <div class="card sect"><h3 style="margin-top:0">Active stations dark for more than 3 days</h3>
        <table><thead><tr><th>Customer</th><th>System</th><th>Station</th><th>Last daily</th><th>Days dark</th></tr></thead><tbody>
        ${u.dark_systems.map(s => `<tr data-row-open="${s.system_id}"><td>${esc(s.full_name)}</td><td>${esc(s.system_name)}</td><td class="mono">${esc(s.solis_station_id)}</td><td>${fmtDate(s.last_daily)}</td><td>${s.days_dark??'∞'}</td></tr>`).join('') || '<tr><td colspan=5 class="muted">none</td></tr>'}
        </tbody></table></div>`;
    // One delegated handler: a click anywhere on a row that has a record
    // behind it opens the panel (the Open column was dropped 2026-09-19 as
    // redundant). Controls inside a row — the Verified checkbox, Retry on the
    // suggestions column — keep their own behaviour.
    el.onclick = e => {
      if (e.target.closest('button,a,input,select,textarea,label')) return;
      const tr = e.target.closest('tr[data-row-open]');
      if (tr) openPanel(tr.dataset.rowOpen);
    };
    // The Verified checkboxes (both tables). The row objects carry what the
    // prompt needs; the tab reloads afterwards so the row moves between lists.
    const byId = {}; [...(u.suspect_mappings||[]), ...(u.verified_mappings||[])].forEach(s => byId[s.system_id] = s);
    $$('#view-unresolved [data-verify]').forEach(cb => cb.onchange = () => setMappingVerified(byId[cb.dataset.verify], cb.checked, loadUnresolved));
    if ((u.suspect_mappings||[]).length) fillSuggestions();
  } catch (e) { el.innerHTML = `<p class="tag bad">${esc(e.message)}</p>`; }
}
// The Solis roster walk can take a minute and fails when Solis is unwell, so
// the suggestions column is filled after the page renders, with a Retry.
async function fillSuggestions(){
  const cells = $$('#view-unresolved [data-sugg]'); if (!cells.length) return;
  try {
    const res = await api('/monitoring-admin/api/suspects/suggestions');
    cells.forEach(td => {
      const hits = res.suggestions[td.dataset.sugg] || [];
      td.innerHTML = hits.length
        ? hits.map(g => `<div><span class="mono">${esc(g.station_id)}</span> ${esc(g.plant_name)} ${g.capacity_kwp??''} kWp${g.email_matches_login?' <span class="tag ok">email matches login</span>':''}</div>`).join('')
        : `<span class="muted">none of the ${res.unassigned_in_roster} unassigned plants is named after this customer</span>`;
    });
  } catch (e) {
    cells.forEach(td => { td.innerHTML = `<span class="muted">${esc(e.message)}</span> <button class="btn sm" data-retry-sugg>Retry</button>`; });
    $$('#view-unresolved [data-retry-sugg]').forEach(b => b.onclick = () => { cells.forEach(td => td.innerHTML = '<span class="muted">looking up the Solis roster…</span>'); fillSuggestions(); });
  }
}

async function loadJobs(){
  const el = $('#view-jobs'); el.innerHTML = '<p class="muted">Loading…</p>';
  try {
    const {jobs} = await api('/monitoring-admin/api/jobs');
    el.innerHTML = `<div class="card"><p class="hint">Jobs are drained by the backfill worker; a station can have one queued or running job per granularity.</p>
      <table><thead><tr><th>Queued</th><th>Customer</th><th>System</th><th>Granularity</th><th>Range</th><th>Status</th><th>Rows</th><th>Error</th><th></th></tr></thead><tbody>
      ${jobs.map(j => `<tr><td>${fmtTs(j.queued_at)}</td><td>${esc(j.full_name)}</td><td>${esc(j.system_name)}</td><td>${esc(j.granularity)}</td><td>${fmtDate(j.date_from)} → ${fmtDate(j.date_to)}</td><td><span class="tag ${j.status==='succeeded'?'ok':j.status==='failed'?'bad':'warn'}">${esc(j.status)}</span></td><td>${j.rows_written??''}</td><td class="muted">${esc(String(j.error||'').slice(0,100))}</td><td>${j.status==='queued'&&canEdit()?`<button class="btn sm danger" data-cancel="${j.id}">Cancel</button>`:''}</td></tr>`).join('') || '<tr><td colspan=9 class="muted">No jobs yet.</td></tr>'}
      </tbody></table></div>`;
    $$('#view-jobs [data-cancel]').forEach(b => b.onclick = async () => { try { await api('/monitoring-admin/api/jobs/'+b.dataset.cancel+'/cancel', {method:'POST'}); loadJobs(); } catch(e) { toast(e.message, true); } });
  } catch (e) { el.innerHTML = `<p class="tag bad">${esc(e.message)}</p>`; }
}

async function loadAudit(){
  const el = $('#view-audit'); el.innerHTML = '<p class="muted">Loading…</p>';
  try {
    const {audit} = await api('/monitoring-admin/api/audit?limit=300');
    el.innerHTML = `<div class="card"><table><thead><tr><th>When</th><th>Who</th><th>Kind</th><th>Table</th><th>Row</th><th>Op</th><th>Field</th><th>Old → New</th><th>Reason</th><th>Source</th></tr></thead><tbody>
      ${audit.map(a => `<tr><td>${fmtTs(a.occurred_at)}</td><td>${esc(a.actor_email||'—')}</td><td><span class="tag ${a.actor_kind==='staff'?'ok':''}">${esc(a.actor_kind)}</span></td><td>${esc(a.table_name)}</td><td class="mono">${esc(String(a.row_pk).slice(0,8))}…</td><td>${esc(a.operation)}</td><td class="mono">${esc(a.field_name||'')}</td><td class="wrap">${a.field_name?`<s>${esc(a.old_value)}</s> → ${esc(a.new_value)}`:'<span class="muted">whole row</span>'}</td><td class="wrap muted">${esc(a.reason||'')}</td><td class="muted">${esc(a.source)}</td></tr>`).join('')}
      </tbody></table></div>`;
  } catch (e) { el.innerHTML = `<p class="tag bad">${esc(e.message)}</p>`; }
}

async function loadStaff(){
  const el = $('#view-staff'); el.innerHTML = '<p class="muted">Loading…</p>';
  try {
    const {staff} = await api('/monitoring-admin/api/staff');
    el.innerHTML = `<div class="card">
      <div class="row" style="margin-bottom:6px"><input id="st-email" type="email" placeholder="colleague@solvivaenergy.com"><input id="st-name" placeholder="Full name"><select id="st-role"><option>readonly</option><option>engineer</option><option>admin</option></select><select id="st-mode"><option value="password">Create with a temporary password (shown once)</option><option value="invite">Send an invite email</option></select><button class="btn primary" id="st-add">Add staff</button></div>
      <p class="hint" style="margin:0 0 12px">A solvivaenergy.com Google account can also just sign in with Google once its address is listed here. Invite emails land on the project's Site URL (Supabase → Authentication → URL Configuration) — set it to this page's address or the link points at localhost.</p>
      <div class="verdict" id="st-result" hidden></div>
      <table><thead><tr><th>Email</th><th>Role</th><th>Active</th><th>Last sign-in</th><th>Providers</th><th>Added</th><th></th></tr></thead><tbody>
      ${staff.map(s => `<tr><td class="mono">${esc(s.email)}</td><td><select data-role="${s.user_id}">${['readonly','engineer','admin'].map(r=>`<option ${s.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td>${s.active&&!s.revoked_at?'<span class="tag ok">active</span>':'<span class="tag bad">revoked</span>'}</td><td>${fmtTs(s.last_sign_in_at)}</td><td class="muted">${esc(JSON.stringify(s.providers||[]))}</td><td>${fmtDate(s.created_at)}</td><td class="row" style="gap:6px">${s.active&&!s.revoked_at?`<button class="btn sm danger" data-revoke="${s.user_id}">Revoke</button>`:`<button class="btn sm" data-restore="${s.user_id}">Restore</button>`}${s.user_id!==me.id?`<button class="btn sm danger" data-delete="${s.user_id}" data-email="${esc(s.email)}" title="Remove the staff row and delete the login, so a fresh invite can be sent">Delete</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`;
    $('#st-add').onclick = async () => {
      const email = $('#st-email').value.trim(), mode = $('#st-mode').value;
      try {
        const res = await api('/monitoring-admin/api/staff', {method:'POST', body:{email, full_name:$('#st-name').value, role:$('#st-role').value, mode}});
        const html = res.temporary_password
          ? `<b>${esc(res.email)}</b> can sign in now (role ${esc(res.role)}). Temporary password — shown only this once, we do not store it:<br><span class="mono" style="font-size:15px;user-select:all">${esc(res.temporary_password)}</span><br><span class="muted">Send it to them privately; they should use <i>Change password</i> after signing in. They can also sign in with Google instead.</span>`
          : `<b>${esc(res.email)}</b> added (role ${esc(res.role)}); an invite email was sent.`;
        toast('Added');
        await loadStaff();                       // refresh the table, then re-show the one-time result
        const box = $('#st-result'); box.hidden = false; box.innerHTML = html;
      } catch(e) { toast(e.message, true); }
    };
    $$('#view-staff [data-role]').forEach(s => s.onchange = async () => { try { await api('/monitoring-admin/api/staff/'+s.dataset.role, {method:'PATCH', body:{role:s.value}}); toast('Role updated'); } catch(e) { toast(e.message, true); loadStaff(); } });
    $$('#view-staff [data-revoke]').forEach(b => b.onclick = async () => { try { await api('/monitoring-admin/api/staff/'+b.dataset.revoke, {method:'PATCH', body:{active:false}}); loadStaff(); } catch(e) { toast(e.message, true); } });
    $$('#view-staff [data-restore]').forEach(b => b.onclick = async () => { try { await api('/monitoring-admin/api/staff/'+b.dataset.restore, {method:'PATCH', body:{active:true}}); loadStaff(); } catch(e) { toast(e.message, true); } });
    $$('#view-staff [data-delete]').forEach(b => b.onclick = async () => {
      if (!confirm(`Delete ${b.dataset.email} as staff AND delete their login?\n\nThey can then be invited or created again from scratch. Customer logins are protected and will be refused.`)) return;
      try { const res = await api('/monitoring-admin/api/staff/'+b.dataset.delete+'?delete_login=true', {method:'DELETE'}); toast(res.login_deleted ? 'Staff row and login deleted' : 'Staff row deleted; login could not be deleted (see server log)'); loadStaff(); }
      catch(e) { toast(e.message, true); }
    });
  } catch (e) { el.innerHTML = `<p class="tag bad">${esc(e.message)}</p>`; }
}

function loadGuide(){
  $('#view-guide').innerHTML = `
  <div class="card" style="max-width:980px;line-height:1.55">
    <h2 style="margin-top:0">How the engineering team fixes customer data here</h2>
    <p class="hint">Everything you change is recorded in <b>Audit</b> with your name and the reason you typed. Nothing here writes to Odoo — Odoo is the sales team's source of truth; when Odoo is wrong, tell sales and they fix it there, and the nightly sync picks it up the following night (02:00).</p>

    <h3>1. A customer is mapped to the wrong Solis station</h3>
    <ol>
      <li>Open the customer. Read the <b>Station</b> section: is the <i>Plant name (Solis)</i> this customer's name? Does the plant's Solis email match the <i>login email</i>? A plant named after someone else with a different email is the wrong station — every day recorded under this customer is that other plant's production. (Unresolved → <i>Possible wrong station</i> lists these automatically.)</li>
      <li><b>Check data vs Solis</b> is a different question: it confirms our stored rows equal Solis for the id we hold. It stays ~99% even on a wrong mapping, so use it after a remap to confirm the backfill, and to catch stale or leftover rows — not to decide identity.</li>
      <li>Find the correct station id (the Odoo lead's "CRM Design Solis Station ID" if sales fixed it, or Solis Cloud). <b>Validate Solis station</b> on it first.</li>
      <li><b>Remap to the correct Solis station</b> → Preview → type the reason in the Save-changes box → Confirm. All readings recorded under the wrong id move to quarantine (kept, not deleted); the plant's name, capacity and first-power date are refreshed from Solis; a backfill of the correct history is queued and runs within 15 minutes.</li>
      <li><b>If no plant in our Solis account is the customer's</b> (the common case found on 17 Sep: none of the 654 plants carried any suspect's name), tick <i>No correct station is known</i> in the Remap box instead: the wrong data is quarantined, the system becomes <i>pending</i> and stops syncing, and the right plant is attached later with <i>Add another Solis station</i> or a Remap once sales/engineering find it.</li>
      <li>Before deciding, read the signals in Unresolved: a login email containing a word of the plant name (a spouse's or relative's name on the plant) or a plant named after an organisation (a church, a shop) usually means the mapping is right and only the profile name needs fixing.</li>
      <li><b>If the mapping is right</b> — the plant is the customer's business, church, lot number or a relative's name, and the Solis email or the data confirm it — tick <b>Manually verified</b>: in the Verified column of the Unresolved table, or in the Station section of the record. Type why. The record leaves <i>Possible wrong station</i>; your name, the time and the reason are shown on the record, kept in Audit, and listed under “manually verified” at the bottom of that table, where the tick can be undone. A Remap, Detach or hand edit of the station id clears the tick automatically, because it was a verdict about that mapping.</li>
      <li>If the wrong id came from the Odoo lead, tell sales to correct the lead — otherwise the grid keeps showing "Odoo ≠ Supabase" for that customer.</li>
    </ol>

    <h3>2. The name/phone/address is wrong but the station is right</h3>
    <p>Signals: the Solis plant email matches the login email, and Check data vs Solis agrees. Edit the <b>Customer profile</b> fields, type a reason, Save. Do not remap.</p>

    <h3>3. A customer has a second plant</h3>
    <p>Unresolved → <i>Second-station candidates</i> → click the row → <b>Add another Solis station</b> → station id + reason → Add. Name and capacity come from Solis; a 60-day backfill is queued. Their login stays the same. (The customer app shows one station until the station selector ships.)</p>

    <h3>4. Missing days / refreshing history</h3>
    <p>In the customer panel, pick a date range → <b>Queue backfill</b>. The worker runs every 15 minutes; progress is in <b>Backfills</b>, and the row shows "backfill running/succeeded". A backfill overwrites the dates it fetches with Solis's current values.</p>

    <h3>5. A new customer isn't appearing</h3>
    <p>Accounts are created automatically every night from Odoo leads that have a valid email and a station id. Unresolved → <i>Nightly onboarding failures</i> lists the leads that were rejected and why (usually two emails in one field, or a placeholder). Those are fixed in Odoo by sales; the account appears the night after.</p>

    <h3>6. Dark stations</h3>
    <p>Unresolved → <i>Active stations dark &gt;3 days</i>. If the plant is really offline or decommissioned, set its <b>Status</b> in the panel (inactive / decommissioned) with a reason, so it stops counting as a data problem.</p>

    <h3>Roles</h3>
    <p><b>readonly</b> sees everything; <b>engineer</b> can edit, remap, add stations and queue backfills; <b>admin</b> also manages staff. Admins add colleagues in <b>Staff</b> — a solvivaenergy.com Google account signs in directly once added.</p>
  </div>`;
}
