# Render.com deployment — Web Service + Background Worker
services:
  # Web API (dashboard, webhooks)
  - type: web
    name: solviva-api
    runtime: docker
    # starter, not free: upgraded in the dashboard 2026-09-17 (free spins down
    # after 15 idle minutes → ~50 s cold start on every first click). The
    # Blueprint re-applies this field on every sync, so it must match here or a
    # push silently downgrades the service again.
    plan: starter
    dockerfilePath: ./Dockerfile
    # Custom hostname. Render issues and renews the TLS certificate itself once
    # DNS resolves: at Cloudflare add  CNAME  monitoring → monitoring-5085.onrender.com
    # (DNS-only / grey cloud, at least until the certificate is issued). The
    # onrender.com hostname keeps working alongside. Monitoring Admin is then
    # https://monitoring.solvivaenergy.com/ (the page is the host root; its API
    # is /monitoring-admin/api/*) — Supabase Site URL + Redirect URLs = that root.
    domains:
      - monitoring.solvivaenergy.com
    envVars:
      - key: SOLIS_CLOUD_KEY_ID
        sync: false
      - key: SOLIS_CLOUD_KEY_SECRET
        sync: false
      # Shared bearer token gating /solis/*. Those 16 routes proxy our Solis
      # credentials and return the whole 648-station fleet with customer names;
      # until 2026-09-15 they had no authentication at all. The routes fail
      # CLOSED (503) when this is unset, so it must be set in the Render
      # dashboard before the next deploy or /solis/* stops serving.
      #
      # It is a fleet-wide credential, not per-customer authorisation. Never
      # ship it in a browser bundle or a mobile app; customer-scoped data
      # belongs on /app/*, which authenticates the Supabase JWT.
      - key: SOLIS_API_TOKEN
        sync: false
      # /app/live, /admin/validate/* and /monitoring-admin/* all need Supabase.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Handed to the Monitoring Admin page so it can start a Supabase Auth session.
      # Public by design (it ships in the mobile app); RLS + staff_users gate it.
      - key: SUPABASE_ANON_KEY
        sync: false
      # Direct Postgres for Monitoring Admin (auth.users join, audited writes).
      # db.<ref>.supabase.co is IPv6-only; if this container has no IPv6 route,
      # set SUPABASE_DB_POOLER_URL to the Session-pooler string instead
      # (Dashboard → Settings → Database → Connection string → Session pooler;
      # the project is in ap-south-1). api/db.py tries both.
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_POOLER_URL
        sync: false
      # Odoo (read-only) for /admin/validate/odoo-* and Monitoring Admin's Odoo
      # panel. Same values as solviva-sync. Without them every "Validate Odoo
      # lead/customer" click fails with "Missing Odoo connection env vars".
      - key: ODOO_SH_URL
        sync: false
      - key: ODOO_SH_DB
        sync: false
      - key: ODOO_SH_USER
        sync: false
      - key: ODOO_SH_API_KEY
        sync: false

  # Daily sync cron: Solis → Supabase (2:00 AM PHT via Render cron)
  - type: cron
    name: solviva-sync
    runtime: docker
    plan: starter
    schedule: "0 18 * * *"  # 6:00 PM UTC = 2:00 AM PHT
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: SOLIS_CLOUD_KEY_ID
        sync: false
      - key: SOLIS_CLOUD_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USER
        sync: false
      - key: ODOO_API_KEY
        sync: false
      - key: DEFAULT_USER_PASSWORD
        sync: false
      # api.sync_identity_mirror (end of the nightly run) writes through
      # psycopg so the audit trigger attributes it. Same note as solviva-api:
      # the direct host is IPv6-only, the Session-pooler string is the fallback.
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_POOLER_URL
        sync: false
      - key: ONBOARD_BACKFILL_DAYS
        value: "60"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false

  # Five-minute sync cron: Solis stationDay -> Supabase energy_readings_five_minutes
  #
  # Every 5 minutes since 2026-09-25 (was */15). A run writes only the points
  # newer than each station's watermark (one request to five_minute_watermarks),
  # takes lifetime income from the 7-page fleet roster instead of a stationAll
  # call per station, and fetches stationDay at SOLIS_CONCURRENCY (default 16;
  # the client gates the process at ~10 calls/s regardless). Measured before
  # this: a run was 4.5–5 min at concurrency 8, ~3.3 s per Solis call.
  #
  # Render never overlaps runs of one cron: if a run is still going at the
  # next tick it DELAYS the next run, so a slow Solis only stretches the
  # cadence — it never skips or corrupts a run. Cron time is billed per second
  # of run time ($1/month minimum). If Solis starts answering 429/502 in
  # bursts, lower SOLIS_CONCURRENCY in this service's env (no deploy needed)
  # before touching the schedule.
  - type: cron
    name: solviva-five-minute-sync
    runtime: docker
    plan: starter
    schedule: "*/5 * * * *"
    dockerfilePath: ./Dockerfile.worker.five_minutes
    envVars:
      # Must equal the schedule above: lifetime earning is refreshed for one
      # slice of the fleet per run, and the slice is picked from the minute of
      # the hour divided by this. Change both together.
      - key: SYNC_CADENCE_MINUTES
        value: "5"
      # Concurrent stationDay calls. The client caps the whole process at
      # ~10 calls/s whatever this says; lower it here first if Solis 429s.
      - key: SOLIS_CONCURRENCY
        value: "16"
      - key: SOLIS_CLOUD_KEY_ID
        sync: false
      - key: SOLIS_CLOUD_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # Backfill worker: drains backfill_jobs, which Monitoring Admin enqueues.
  # Nothing else runs those jobs. 15-minute cron, 12-minute budget per run.
  - type: cron
    name: solviva-backfill-worker
    runtime: docker
    plan: starter
    schedule: "*/15 * * * *"
    dockerfilePath: ./Dockerfile.worker.backfill
    envVars:
      - key: SOLIS_CLOUD_KEY_ID
        sync: false
      - key: SOLIS_CLOUD_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_POOLER_URL
        sync: false

  # Cross-system MCP server for Claude Teams (read-only, shared service token).
  # Must NOT be plan: free — a cold start blows Claude's 10s connector timeout.
  - type: web
    name: solviva-mcp
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.mcp
    healthCheckPath: /healthz
    envVars:
      - key: MCP_SERVICE_TOKEN
        sync: false
      - key: MCP_PUBLIC_HOST
        sync: false
      - key: SOLIS_CLOUD_KEY_ID
        sync: false
      - key: SOLIS_CLOUD_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ODOO_SH_URL
        sync: false
      - key: ODOO_SH_DB
        sync: false
      - key: ODOO_SH_USER
        sync: false
      - key: ODOO_SH_API_KEY
        sync: false
